<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box Model, Borders & Shadows</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Box Model &amp; Shadows</h1>
      <div class="grid">
        <div class="c">
          <h3>The box model</h3>
          <div class="m">
            <div class="b">
              <div class="p">
                <div class="ct">content</div>
              </div>
            </div>
          </div>
        </div>
        <div class="c">
          <h3>Elevation</h3>
          <div class="el">
            <i class="e1"></i><i class="e2"></i><i class="e3"></i
            ><i class="e4"></i>
          </div>
        </div>
        <div class="c">
          <h3>Border radius</h3>
          <div class="rad">
            <i style="border-radius: 0"></i><i style="border-radius: 16px"></i
            ><i style="border-radius: 50%"></i
            ><i style="border-radius: 50% 0 50% 0"></i
            ><i style="border-radius: 30px 8px"></i>
          </div>
        </div>
        <div class="c">
          <h3>Outline offset</h3>
          <div class="ring">outline</div>
        </div>
        <div class="c">
          <h3>Inset shadow</h3>
          <div class="inset">pressed</div>
        </div>
        <div class="c">
          <h3>Border styles</h3>
          <div class="bs">
            <i style="border-style: solid"></i
            ><i style="border-style: dashed"></i
            ><i style="border-style: dotted"></i
            ><i style="border-style: double"></i>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
